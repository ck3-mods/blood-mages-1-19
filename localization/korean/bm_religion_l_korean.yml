  # Religion family
  rf_quintessence: "정수"
  rf_quintessence_desc: "피에 담긴 생명의 본질에 대한 지배력을 추구하는 신앙입니다."
  rf_quintessence_opinion: "[GetReligionFamily('rf_quintessence').GetName] 의견"

  # Core Terms - Religion
  quintessence_religion: "정수 숭배"
  quintessence_religion_adj: "정수주의"
  quintessence_religion_adherent: "정수주의자"
  quintessence_religion_adherent_plural: "정수주의자"
  quintessence_religion_desc: "정수 숭배(Cult of the Quintessence)는 모든 존재를 통해 흐르는 원시 생명력을 신성한 것이 아니라 궁극적인 힘의 화폐로 인식합니다. 금지된 피의 의식과 계산된 희생을 통해 추종자들은 이 정수를 추출하고 조작하고 활용하여 필멸의 한계를 초월합니다. 신을 숭배하는 전통적인 신앙과는 달리, 정수주의자들는 자신을 존재의 기본 기반의 주인이 될 것으로 봅니다."
  # Core Terms - Faith
  quintessence_faith: "정수 숭배"
  quintessence_faith_adj: "정수주의"
  quintessence_faith_adherent: "정수주의자"
  quintessence_faith_adherent_plural: "정수주의자"
  quintessence_faith_desc: "기독교 정수론자들은 갈보리에서 흘린 피가 더 깊은 신비를 드러냈다고 선언합니다. 생명 자체는 쏟아지고, 받아들여지고, 통제될 수 있는 신성한 흐름입니다. 그들은 금지된 진홍색 신학을 통해 수난, 순교자, 성찬을 해석하며, 모든 심장 박동이 그리스도의 희생을 반영하며 피의 신비를 이해하는 사람은 죽을 육체의 나약함을 극복할 수 있다고 가르칩니다."
  quintessence_faith_islamic: "$quintessence_faith$"
  quintessence_faith_islamic_adj: "$quintessence_faith_adj$"
  quintessence_faith_islamic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_islamic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_islamic_desc: "이슬람 정수주의자들은 알라만이 신이고 피는 amanah, 즉 모든 생명체 안에 있는 신성한 신뢰라고 주장합니다. 그들은 선지자, 의사, 신비주의자들이 각각 그 숨겨진 율법의 일부를 보았고, 규율 있는 의식, 단식, 신중하게 측정된 희생을 통해 충실한 자들이 창조에 기록된 질서에 복종하면서 생명의 흐름을 마스터할 수 있다고 주장합니다."
  quintessence_faith_jewish: "$quintessence_faith$"
  quintessence_faith_jewish_adj: "$quintessence_faith_adj$"
  quintessence_faith_jewish_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_jewish_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_jewish_desc: "유대인 정수주의자들은 육체의 생명이 피에 있다는 고대의 가르침으로 시작합니다. 그들은 언약, 할례, 성전 희생의 기억을 숨겨진 규율의 단편으로 간주하며, 피는 세대의 상속과 백성을 하나로 묶는 의무를 모두 수반한다고 믿습니다. 그 유산을 명령하는 것은 그들의 눈에는 창조의 가장 깊은 흐름에 닿는 것입니다."
  quintessence_faith_eastern: "$quintessence_faith$"
  quintessence_faith_eastern_adj: "$quintessence_faith_adj$"
  quintessence_faith_eastern_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_eastern_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_eastern_desc: "Eastern 정수주의자들는 Quintessence를 삼사라(samsara)를 통해 움직이는 생명의 흐름, 즉 호흡, 혈액, 카르마, 의식이 단일 순환 내에 묶여 있다고 설명합니다. 어떤 사람들은 그것을 프라나라고 부르고, 다른 사람들은 그것을 애착을 풀거나 카르마의 부담을 정화하는 수단으로 이해합니다. 모두는 엄격한 의식이 이 흐름을 각성, 장수, 최종 해방으로 방향을 바꿀 수 있다고 가르칩니다."
  quintessence_faith_sinitic: "$quintessence_faith$"
  quintessence_faith_sinitic_adj: "$quintessence_faith_adj$"
  quintessence_faith_sinitic_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_sinitic_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_sinitic_desc: "Sinitic 정수주의자들는 피는 qi의 가장 밀도가 높은 혈관이며 조상으로부터 물려 받아 하늘 아래 질서를 유지한다고 주장합니다. 몸의 경락을 추적하고, 죽은 자를 기리고, 희생과 조화의 균형을 유지함으로써 그들은 물려받은 본질을 낭비하기보다는 정제하려고 노력합니다. 완전한 순환은 몸과 혈통과 우주를 하나의 진홍색 질서로 하나로 묶는다고 합니다."
  quintessence_faith_asatru: "$quintessence_faith$"
  quintessence_faith_asatru_adj: "$quintessence_faith_adj$"
  quintessence_faith_asatru_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_asatru_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_asatru_desc: "Ásatrú 정수주의자들는 외국 숙박을 거부하고 오딘의 시련에 담긴 진홍빛 흐름, einherjar의 전투 분노, blót에서 흘린 피를 인식합니다. 목적을 가지고 죽이거나 죽는 것은 씨족, 땅, 신에게 힘을 방출합니다. 전쟁은 성찬이고, 희생은 교환이며, 정수는 그것을 차지할 만큼 대담한 자의 것입니다."
  quintessence_faith_unreformed: "$quintessence_faith$"
  quintessence_faith_unreformed_adj: "$quintessence_faith_adj$"
  quintessence_faith_unreformed_adherent: "$quintessence_faith_adherent$"
  quintessence_faith_unreformed_adherent_plural: "$quintessence_faith_adherent_plural$"
  quintessence_faith_unreformed_desc: "고대 신들의 추종자들 사이에서 피는 필멸자와 조상, 영혼 사이에서 사용되는 첫 번째 언어로 기억됩니다. 정수주의자들는 맹세, 헌금 및 희생 잔치를 보존하지만 이러한 의식은 보이지 않는 힘을 달래는 것 이상의 역할을 한다고 가르칩니다. 그들은 힘이 짐승에서 전사로, 죽은 자에서 산 자에게, 땅에서 선택된 백성에게 전달되는 통로를 엽니다."
